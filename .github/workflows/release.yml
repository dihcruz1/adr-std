name: release

# Publica o pacote quando uma tag vX.Y.Z é criada. A publicação só acontece se o gate de segurança
# e os testes passarem (contrato SDD: todo CI/CD tem gate de segurança antes do deploy).

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificações estáticas (SKILL.md, VERSION, norma, tamanho)
        run: bash tests/gate.sh static
      - name: Tag igual a VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash tests/gate.sh tag "${GITHUB_REF_NAME}"
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bin/adr-std package.sh packaging/*.sh packaging/*.command tests/gate.sh tests/test_cli.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions -EnableExit
      - name: Testes do script de verificação
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  test:
    name: Testes do comando (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes do comando e do instalador (bash)
        run: bash tests/test_cli.sh

  test-windows:
    name: Testes do comando (Windows)
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester -Path tests/test_cli.ps1 -CI

  publish:
    name: Publicar release
    needs: [gate, test, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar pacote (exige todos os arquivos)
        run: bash package.sh --release dist
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/adr-std.zip
            dist/adr-std.zip.sha256
